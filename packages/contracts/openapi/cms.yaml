openapi: 3.1.0
info:
  title: Candidate Supply CMS API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current internal user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCurrentUserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /search:
    get:
      operationId: searchWorkspace
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        '200':
          description: Permission-scoped workspace search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSearchResponseEnvelope'
        default:
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGenericObjectEnvelope'
  /saved-views:
    get:
      operationId: listSavedViews
      parameters:
        - in: query
          name: resource
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved views
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSavedViewsResponseEnvelope'
        default:
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createSavedView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveViewRequest'
      responses:
        '201':
          description: Saved view created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSavedViewEnvelope'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /saved-views/{id}:
    patch:
      operationId: updateSavedView
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveViewRequest'
      responses:
        '200':
          description: Saved view updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSavedViewEnvelope'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /work-items:
    post:
      operationId: createWorkItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkItemRequest'
      responses:
        '201':
          description: Created manual work item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiWorkItemEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
    get:
      operationId: listWorkItems
      parameters:
        - in: query
          name: view
          required: false
          schema:
            type: string
            default: actionable
        - in: query
          name: sort
          required: false
          schema:
            type: string
            default: priority
        - in: query
          name: query
          required: false
          schema:
            type: string
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Work queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiWorkItemsResponseEnvelope'
        default:
          $ref: '#/components/responses/Unauthorized'
  /work-items/summary:
    get:
      operationId: getWorkSummary
      parameters:
        - in: query
          name: view
          required: false
          schema:
            type: string
            default: actionable
      responses:
        '200':
          description: Work queue KPI summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiWorkSummaryResponseEnvelope'
        default:
          $ref: '#/components/responses/Unauthorized'
  /work-items/{id}:
    get:
      operationId: getWorkItem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Work item detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiWorkItemEnvelope'
        default:
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateWorkItem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkItemUpdate'
      responses:
        '200':
          description: Updated work item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiWorkItemEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /clients:
    get:
      operationId: listClients
      parameters:
        - in: query
          name: query
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Client list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiClientsResponseEnvelope'
        default:
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Client created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiClientEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /clients/{id}:
    get:
      operationId: getClient
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Client detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiClientEnvelope'
        default:
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateClient
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdateRequest'
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiClientEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /orders:
    get:
      operationId: listOrders
      parameters:
        - in: query
          name: query
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: industry
          required: false
          schema:
            type: string
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Recruitment order list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOrdersResponseEnvelope'
        default:
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Recruitment order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobOrderEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recruitment order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobOrderEnvelope'
        default:
          $ref: '#/components/responses/Unauthorized'
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      responses:
        '200':
          description: Updated recruitment order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobOrderEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /orders/{id}/requirements:
    patch:
      operationId: updateOrderRequirement
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequirementUpdate'
      responses:
        '200':
          description: Updated order requirement snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobOrderEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /orders/{id}/applications:
    post:
      operationId: addCandidatesToOrder
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCandidatesRequest'
      responses:
        '201':
          description: Applications created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAddCandidatesResponseEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /candidates/search-for-order:
    get:
      operationId: searchCandidatesForOrder
      parameters:
        - in: query
          name: orderId
          required: true
          schema:
            type: string
        - in: query
          name: query
          required: false
          schema:
            type: string
        - in: query
          name: industrySectorId
          required: false
          schema:
            type: string
        - in: query
          name: occupationId
          required: false
          schema:
            type: string
        - in: query
          name: skill
          required: false
          schema:
            type: string
        - in: query
          name: japaneseLevel
          required: false
          schema:
            type: string
        - in: query
          name: readinessStatus
          required: false
          schema:
            type: string
        - in: query
          name: hasActiveJourney
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Candidate matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCandidateSearchResponseEnvelope'
        default:
          $ref: '#/components/responses/Unauthorized'
  /candidates:
    get:
      operationId: listCandidates
      parameters:
        - in: query
          name: query
          required: false
          schema:
            type: string
        - in: query
          name: view
          required: false
          schema:
            type: string
            enum:
              - all
              - potential
              - new-unassigned
              - ready-to-match
              - applying
              - passed
              - supplying
              - supplied
              - paused
              - archived
              - missing-contact
              - missing-documents
              - duplicates
        - in: query
          name: industrySectorId
          required: false
          schema:
            type: string
        - in: query
          name: readinessStatus
          required: false
          schema:
            type: string
        - in: query
          name: contactabilityStatus
          required: false
          schema:
            type: string
        - in: query
          name: occupationId
          required: false
          schema:
            type: string
        - in: query
          name: skill
          required: false
          schema:
            type: string
        - in: query
          name: desiredLocation
          required: false
          schema:
            type: string
        - in: query
          name: source
          required: false
          schema:
            type: string
        - in: query
          name: recordStatus
          required: false
          schema:
            type: string
        - in: query
          name: experience
          required: false
          schema:
            type: string
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Candidate master list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCandidatesResponseEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCandidateRequest'
      responses:
        '201':
          description: Candidate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCandidateEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /candidates/{id}:
    get:
      operationId: getCandidate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Candidate 360 detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCandidateDetailEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateCandidate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateUpdateRequest'
      responses:
        '200':
          description: Candidate updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCandidateDetailEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /candidates/{id}/archive:
    post:
      operationId: archiveCandidate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateArchiveRequest'
      responses:
        '200':
          description: Candidate archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCandidateDetailEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /candidates/imports:
    post:
      operationId: importCandidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCandidatesRequest'
      responses:
        '201':
          description: Candidate import accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiImportCandidatesResponseEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /candidates/{id}/duplicate-review:
    post:
      operationId: reviewCandidateDuplicate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateReviewRequest'
      responses:
        '200':
          description: Duplicate review recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCandidateEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /applications:
    get:
      operationId: listApplications
      parameters:
        - in: query
          name: query
          required: false
          schema:
            type: string
        - in: query
          name: view
          required: false
          schema:
            type: string
            enum:
              - screening
              - waiting-interview
              - interviewed
              - waiting-result
              - passed
              - failed
              - withdrawn
              - closed
              - overdue
        - in: query
          name: orderId
          required: false
          schema:
            type: string
        - in: query
          name: ownerId
          required: false
          schema:
            type: string
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Application pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiApplicationsResponseEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unauthorized'
  /views/waiting-interviews:
    get:
      operationId: listWaitingInterviews
      parameters:
        - in: query
          name: query
          required: false
          schema:
            type: string
        - in: query
          name: orderId
          required: false
          schema:
            type: string
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Active applications waiting for a scheduled interview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiApplicationsResponseEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unauthorized'
  /views/interviewed:
    get:
      operationId: listInterviewedApplications
      parameters:
        - in: query
          name: query
          required: false
          schema:
            type: string
        - in: query
          name: orderId
          required: false
          schema:
            type: string
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Applications with a completed interview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiApplicationsResponseEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unauthorized'
  /views/passed-applications:
    get:
      operationId: listPassedApplications
      parameters:
        - in: query
          name: query
          required: false
          schema:
            type: string
        - in: query
          name: orderId
          required: false
          schema:
            type: string
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Applications passed by decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiApplicationsResponseEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unauthorized'
  /applications/{id}:
    get:
      operationId: getApplication
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application detail with interview timeline and audit history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiApplicationDetailEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unauthorized'
  /applications/{id}/interviews:
    post:
      operationId: createApplicationInterview
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterviewRequest'
      responses:
        '201':
          description: Interview scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInterviewEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /applications/{id}/interviews/{interviewId}/reschedules:
    post:
      operationId: rescheduleApplicationInterview
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: interviewId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleInterviewRequest'
      responses:
        '200':
          description: Rescheduled interview with previous schedule preserved in history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInterviewEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Unauthorized'
      security:
        - sessionCookie: []
          csrfHeader: []
  /applications/{id}/interviews/{interviewId}/cancellation:
    post:
      operationId: cancelApplicationInterview
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: interviewId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInterviewRequest'
      responses:
        '200':
          description: Interview cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInterviewEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
