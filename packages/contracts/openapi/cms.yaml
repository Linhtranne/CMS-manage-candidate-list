openapi: 3.1.0
info:
  title: Candidate Supply CMS API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current internal user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /search:
    get:
      operationId: searchWorkspace
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        '200':
          description: Permission-scoped workspace search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        default:
          $ref: '#/components/responses/Unauthorized'
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated internal session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Session revoked
        default:
          $ref: '#/components/responses/Unauthorized'
  /saved-views:
    get:
      operationId: listSavedViews
      parameters:
        - in: query
          name: resource
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Saved views
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SavedView' }
        default:
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createSavedView
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveViewRequest' }
      responses:
        '201':
          description: Saved view created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        default:
          $ref: '#/components/responses/Unauthorized'
  /saved-views/{id}:
    patch:
      operationId: updateSavedView
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveViewRequest' }
      responses:
        '200':
          description: Saved view updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        default:
          $ref: '#/components/responses/Unauthorized'
  /work-items:
    get:
      operationId: listWorkItems
      parameters:
        - { in: query, name: view, required: false, schema: { type: string, default: actionable } }
        - { in: query, name: sort, required: false, schema: { type: string, default: priority } }
        - { in: query, name: query, required: false, schema: { type: string } }
        - { in: query, name: cursor, required: false, schema: { type: string } }
      responses:
        '200':
          description: Work queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItemsResponse' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /work-items/summary:
    get:
      operationId: getWorkSummary
      parameters:
        - { in: query, name: view, required: false, schema: { type: string, default: actionable } }
      responses:
        '200':
          description: Work queue KPI summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkSummaryResponse' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /work-items/{id}:
    get:
      operationId: getWorkItem
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Work item detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        default: { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateWorkItem
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItemUpdate' }
      responses:
        '200':
          description: Updated work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /clients:
    get:
      operationId: listClients
      parameters:
        - { in: query, name: query, required: false, schema: { type: string } }
        - { in: query, name: status, required: false, schema: { type: string } }
      responses:
        '200':
          description: Client list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientsResponse' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /clients/{id}:
    get:
      operationId: getClient
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Client detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /orders:
    get:
      operationId: listOrders
      parameters:
        - { in: query, name: query, required: false, schema: { type: string } }
        - { in: query, name: status, required: false, schema: { type: string } }
        - { in: query, name: industry, required: false, schema: { type: string } }
      responses:
        '200':
          description: Recruitment order list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdersResponse' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Recruitment order detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderStatusUpdate' }
      responses:
        '200':
          description: Updated recruitment order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /orders/{id}/applications:
    post:
      operationId: addCandidatesToOrder
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCandidatesRequest' }
      responses:
        '201':
          description: Applications created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddCandidatesResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /candidates/search-for-order:
    get:
      operationId: searchCandidatesForOrder
      parameters:
        - { in: query, name: orderId, required: true, schema: { type: string } }
        - { in: query, name: query, required: false, schema: { type: string } }
        - { in: query, name: industry, required: false, schema: { type: string } }
      responses:
        '200':
          description: Candidate matches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateSearchResponse' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /candidates:
    get:
      operationId: listCandidates
      parameters:
        - { in: query, name: query, required: false, schema: { type: string } }
        - { in: query, name: view, required: false, schema: { type: string, enum: [all, potential, applying, passed, supplying, supplied, missing-contact, duplicates] } }
        - { in: query, name: industry, required: false, schema: { type: string } }
        - { in: query, name: readiness, required: false, schema: { type: string } }
        - { in: query, name: contactability, required: false, schema: { type: string } }
        - { in: query, name: cursor, required: false, schema: { type: string } }
      responses:
        '200':
          description: Candidate master list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatesResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCandidateRequest' }
      responses:
        '201':
          description: Candidate created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /candidates/{id}:
    get:
      operationId: getCandidate
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Candidate 360 detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateCandidate
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateUpdateRequest' }
      responses:
        '200':
          description: Candidate updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateDetail' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /candidates/imports:
    post:
      operationId: importCandidates
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportCandidatesRequest' }
      responses:
        '201':
          description: Candidate import accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportCandidatesResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /candidates/{id}/duplicate-review:
    post:
      operationId: reviewCandidateDuplicate
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateReviewRequest' }
      responses:
        '200':
          description: Duplicate review recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /applications:
    get:
      operationId: listApplications
      parameters:
        - { in: query, name: query, required: false, schema: { type: string } }
        - { in: query, name: view, required: false, schema: { type: string, enum: [screening, waiting-interview, interviewed, waiting-result, passed, closed, overdue] } }
        - { in: query, name: orderId, required: false, schema: { type: string } }
        - { in: query, name: ownerId, required: false, schema: { type: string } }
        - { in: query, name: cursor, required: false, schema: { type: string } }
      responses:
        '200':
          description: Application pipeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationsResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /applications/{id}:
    get:
      operationId: getApplication
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Application detail with interview timeline and audit history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /applications/{id}/interviews:
    post:
      operationId: createApplicationInterview
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInterviewRequest' }
      responses:
        '201':
          description: Interview scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interview' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /applications/{id}/interviews/{interviewId}/reschedules:
    post:
      operationId: rescheduleApplicationInterview
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: interviewId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleInterviewRequest' }
      responses:
        '200':
          description: Rescheduled interview with previous schedule preserved in history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interview' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /applications/{id}/interviews/{interviewId}/cancellation:
    post:
      operationId: cancelApplicationInterview
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: interviewId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelInterviewRequest' }
      responses:
        '200':
          description: Interview cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interview' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /applications/{id}/interviews/{interviewId}/no-show:
    post:
      operationId: markApplicationInterviewNoShow
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: interviewId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelInterviewRequest' }
      responses:
        '200':
          description: Interview marked as no-show
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interview' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /applications/{id}/interviews/{interviewId}/results:
    post:
      operationId: saveApplicationInterviewResult
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: interviewId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveInterviewResultRequest' }
      responses:
        '200':
          description: Interview result saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interview' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /applications/{id}/decisions:
    post:
      operationId: decideApplication
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationDecisionRequest' }
      responses:
        '200':
          description: Application decision saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /applications/{id}/journey-eligibility:
    get:
      operationId: getApplicationJourneyEligibility
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Eligibility and active journey conflict check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyEligibility' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /applications/{id}/supply-journey:
    post:
      operationId: startApplicationSupplyJourney
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartSupplyJourneyRequest' }
      responses:
        '201':
          description: Supply journey started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplyJourney' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /supply-journeys:
    get:
      operationId: listSupplyJourneys
      parameters:
        - { in: query, name: query, required: false, schema: { type: string } }
        - { in: query, name: view, required: false, schema: { type: string, enum: [all, active, on-hold, at-risk, waiting-candidate, waiting-external, completed] } }
        - { in: query, name: ownerId, required: false, schema: { type: string } }
      responses:
        '200':
          description: Supply journey list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplyJourneysResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /supply-journeys/{id}:
    get:
      operationId: getSupplyJourney
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Supply journey detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplyJourneyDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /supply-journeys/{id}/milestones/{milestoneId}:
    patch:
      operationId: updateSupplyJourneyMilestone
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: milestoneId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMilestoneRequest' }
      responses:
        '200':
          description: Updated milestone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyMilestone' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /supply-journeys/{id}/milestones/{milestoneId}/waiver:
    post:
      operationId: waiveSupplyJourneyMilestone
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: milestoneId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaiveMilestoneRequest' }
      responses:
        '200':
          description: Waived milestone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyMilestone' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /mailbox/conversations:
    get:
      operationId: listMailboxConversations
      parameters:
        - { in: query, name: query, required: false, schema: { type: string } }
        - { in: query, name: view, required: false, schema: { type: string, enum: [all, needs-action, unmatched, sent, received] } }
      responses:
        '200':
          description: Shared mailbox conversations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationsResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /mailbox/conversations/{id}:
    get:
      operationId: getMailboxConversation
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Conversation thread
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /mailbox/conversations/{id}/send:
    post:
      operationId: sendMailboxEmail
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendEmailRequest' }
      responses:
        '202':
          description: Email queued for sending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSendResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /mailbox/conversations/{id}/link:
    post:
      operationId: linkMailboxConversation
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkConversationRequest' }
      responses:
        '200':
          description: Conversation linked to a candidate context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unauthorized' }
  /reports/summary:
    get:
      operationId: getReportSummary
      parameters:
        - { in: query, name: from, required: false, schema: { type: string, format: date } }
