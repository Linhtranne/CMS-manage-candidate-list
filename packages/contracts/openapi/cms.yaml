components:
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Conflict:
      description: Optimistic concurrency or duplicate relation conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    ValidationError:
      description: Business validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Forbidden:
      description: Permission required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    CurrentUser:
      type: object
      required:
        - id
        - displayName
        - roles
        - permissions
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    ApiProblem:
      type: object
      required:
        - error
        - requestId
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        requestId:
          type: string
          minLength: 1
    SearchResult:
      type: object
      required:
        - id
        - type
        - typeLabel
        - primaryText
        - href
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - candidate
            - client
            - order
        typeLabel:
          type: string
        primaryText:
          type: string
        secondaryText:
          type: string
        href:
          type: string
    SearchResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
    Session:
      type: object
      required:
        - user
        - expiresAt
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        expiresAt:
          type: string
          format: date-time
    SaveViewRequest:
      type: object
      required:
        - resource
        - name
        - query
        - visibility
      properties:
        resource:
          type: string
        name:
          type: string
        query:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        visibility:
          type: string
          enum:
            - PRIVATE
            - TEAM
    SavedView:
      allOf:
        - $ref: '#/components/schemas/SaveViewRequest'
        - type: object
          required:
            - id
            - createdAt
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    PersonRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    CandidateRef:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
    ClientRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    OrderRef:
      type: object
      required:
        - id
        - code
        - position
      properties:
        id:
          type: string
        code:
          type: string
        position:
          type: string
    WorkItem:
      type: object
      required:
        - id
        - title
        - priority
        - status
        - dueAt
        - assignee
        - sourceType
        - sourceLabel
        - candidate
        - order
        - client
        - updatedAt
        - version
        - waitingOn
      properties:
        id:
          type: string
        title:
          type: string
        priority:
          type: string
          enum:
            - URGENT
            - HIGH
            - NORMAL
        status:
          type: string
          enum:
            - NEW
            - IN_PROGRESS
            - DONE
            - CANCELLED
        dueAt:
          type: string
          format: date-time
        assignee:
          $ref: '#/components/schemas/PersonRef'
        sourceType:
          type: string
        sourceLabel:
          type: string
        candidate:
          $ref: '#/components/schemas/CandidateRef'
        order:
          $ref: '#/components/schemas/OrderRef'
        client:
          $ref: '#/components/schemas/ClientRef'
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        lastActivity:
          type: string
        notes:
          type: string
        waitingOn:
          type: string
          enum:
            - NONE
            - CANDIDATE
            - CLIENT_PARTNER
            - INTERNAL
            - SYSTEM
    WorkItemsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkItem'
    WorkSummary:
      type: object
      required:
        - overdue
        - today
        - waitingReply
        - unresolvedEmail
        - journeyRisk
      properties:
        overdue:
          type: integer
        today:
          type: integer
        waitingReply:
          type: integer
        unresolvedEmail:
          type: integer
        journeyRisk:
          type: integer
    WorkSummaryResponse:
      type: object
      required:
        - summary
      properties:
        summary:
          $ref: '#/components/schemas/WorkSummary'
    WorkItemUpdate:
      type: object
      required:
        - version
      properties:
        status:
          type: string
          enum:
            - NEW
            - IN_PROGRESS
            - DONE
            - CANCELLED
        dueAt:
          type: string
          format: date-time
        assigneeId:
          type: string
        reason:
          type: string
        version:
          type: integer
          minimum: 1
        waitingOn:
          type: string
          enum:
            - NONE
            - CANDIDATE
            - CLIENT_PARTNER
            - INTERNAL
            - SYSTEM
    Client:
      type: object
      required:
        - id
        - code
        - name
        - organizationType
        - industryLabels
        - owner
        - activeOrders
        - target
        - passed
        - lastActivity
        - status
        - region
        - version
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        organizationType:
          type: string
        industryLabels:
          type: array
          items:
            type: string
        owner:
          $ref: '#/components/schemas/PersonRef'
        activeOrders:
          type: integer
        target:
          type: integer
        passed:
          type: integer
        lastActivity:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PROSPECT
            - ACTIVE
            - PAUSED
            - INACTIVE
        region:
          type: string
        contactName:
          type: string
        notes:
          type: string
        version:
          type: integer
          minimum: 1
