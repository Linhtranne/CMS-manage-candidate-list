components:
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Conflict:
      description: Optimistic concurrency or duplicate relation conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    ValidationError:
      description: Business validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Forbidden:
      description: Permission required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    CurrentUser:
      type: object
      required: [id, displayName, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    ApiProblem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
    SearchResult:
      type: object
      required: [id, type, typeLabel, primaryText, href]
      properties:
        id: { type: string }
        type: { type: string, enum: [candidate, client, order] }
        typeLabel: { type: string }
        primaryText: { type: string }
        secondaryText: { type: string }
        href: { type: string }
    SearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, writeOnly: true }
    Session:
      type: object
      required: [user, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/CurrentUser' }
        expiresAt: { type: string, format: date-time }
    SaveViewRequest:
      type: object
      required: [resource, name, query, visibility]
      properties:
        resource: { type: string }
        name: { type: string }
        query: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: array, items: { type: string } }] } }
        visibility: { type: string, enum: [PRIVATE, TEAM] }
    SavedView:
      allOf:
        - $ref: '#/components/schemas/SaveViewRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    CandidateRef:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
    ClientRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    OrderRef:
      type: object
      required: [id, code, position]
      properties:
        id: { type: string }
        code: { type: string }
        position: { type: string }
    WorkItem:
      type: object
      required: [id, title, priority, status, dueAt, assignee, sourceType, sourceLabel, candidate, order, client, updatedAt, version]
      properties:
        id: { type: string }
        title: { type: string }
        priority: { type: string, enum: [URGENT, HIGH, NORMAL] }
        status: { type: string, enum: [TODO, IN_PROGRESS, WAITING_REPLY, DONE] }
        dueAt: { type: string, format: date-time }
        assignee: { $ref: '#/components/schemas/PersonRef' }
        sourceType: { type: string }
        sourceLabel: { type: string }
        candidate: { $ref: '#/components/schemas/CandidateRef' }
        order: { $ref: '#/components/schemas/OrderRef' }
        client: { $ref: '#/components/schemas/ClientRef' }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 0 }
        lastActivity: { type: string }
        notes: { type: string }
    WorkItemsResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkItem' } }
        nextCursor: { type: string, nullable: true }
    WorkSummary:
      type: object
      required: [overdue, today, waitingReply, unresolvedEmail, journeyRisk]
      properties:
        overdue: { type: integer }
        today: { type: integer }
        waitingReply: { type: integer }
        unresolvedEmail: { type: integer }
        journeyRisk: { type: integer }
    WorkSummaryResponse:
      type: object
      required: [summary]
      properties:
        summary: { $ref: '#/components/schemas/WorkSummary' }
    WorkItemUpdate:
      type: object
      required: [version]
      properties:
        status: { type: string, enum: [TODO, IN_PROGRESS, WAITING_REPLY, DONE] }
        dueAt: { type: string, format: date-time }
        assigneeId: { type: string }
        reason: { type: string }
        version: { type: integer, minimum: 0 }
    Client:
      type: object
      required: [id, code, name, organizationType, industryLabels, owner, activeOrders, target, passed, lastActivity, status, region]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        organizationType: { type: string }
        industryLabels: { type: array, items: { type: string } }
        owner: { $ref: '#/components/schemas/PersonRef' }
        activeOrders: { type: integer }
        target: { type: integer }
        passed: { type: integer }
        lastActivity: { type: string, format: date-time }
        status: { type: string, enum: [PROSPECT, ACTIVE, PAUSED, INACTIVE] }
        region: { type: string }
        contactName: { type: string }
        notes: { type: string }
    ClientsResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Client' } }
    OrderMetrics:
      type: object
      required: [target, activeApplications, passed, supplied]
      properties:
        target: { type: integer }
        activeApplications: { type: integer }
        passed: { type: integer }
        supplied: { type: integer }
    JobOrder:
      type: object
      required: [id, code, position, client, industryLabel, occupation, location, target, deadline, owner, status, metrics, health, version]
      properties:
        id: { type: string }
        code: { type: string }
        position: { type: string }
        client: { $ref: '#/components/schemas/ClientRef' }
        industryLabel: { type: string }
        occupation: { type: string }
        location: { type: string }
        target: { type: integer }
        deadline: { type: string, format: date-time }
        owner: { $ref: '#/components/schemas/PersonRef' }
        status: { type: string, enum: [DRAFT, RECRUITING, PAUSED, FILLED, CLOSED] }
        metrics: { $ref: '#/components/schemas/OrderMetrics' }
        health: { type: string, enum: [EXPIRING, UNDER_TARGET, INTERVIEW_DELAY, RESULT_DELAY, FILLED, CLIENT_PAUSED] }
        version: { type: integer, minimum: 0 }
        salary: { type: string }
        contractType: { type: string }
        japaneseLevel: { type: string }
        criteria: { type: array, items: { type: string } }
    OrdersResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JobOrder' } }
    CandidateMatch:
      type: object
      required: [id, code, name, industryLabel, occupation, japaneseLevel, readiness, hasActiveApplicationInOrder, hasActiveJourney]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        industryLabel: { type: string }
        occupation: { type: string }
        japaneseLevel: { type: string }
        readiness: { type: string }
        hasActiveApplicationInOrder: { type: boolean }
        hasActiveJourney: { type: boolean }
    CandidateSearchResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CandidateMatch' } }
    CandidateOccupationProfile:
      type: object
      required: [industryLabel, occupation, yearsExperience, skills, status]
      properties:
        industryLabel: { type: string }
        occupation: { type: string }
        yearsExperience: { type: number, minimum: 0 }
        skills: { type: array, items: { type: string } }
        status: { type: string, enum: [PRIMARY, SECONDARY, ARCHIVED] }
    CandidateFile:
      type: object
      required: [id, fileName, category, scanStatus, uploadedAt]
      properties:
        id: { type: string }
        fileName: { type: string }
        category: { type: string, enum: [CV, IDENTITY, CERTIFICATE, LANGUAGE, OTHER] }
        scanStatus: { type: string, enum: [PENDING, SAFE, QUARANTINED, REJECTED] }
        uploadedAt: { type: string, format: date-time }
        downloadUrl: { type: string, format: uri, nullable: true }
    CandidateHistoryEvent:
      type: object
      required: [id, type, occurredAt, actor, summary]
      properties:
        id: { type: string }
        type: { type: string, enum: [CREATED, PROFILE_UPDATED, APPLICATION_CREATED, JOURNEY_STARTED, EMAIL_RECEIVED, NOTE_ADDED, FILE_ATTACHED] }
        occurredAt: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/PersonRef' }
        summary: { type: string }
    Candidate:
      type: object
      required: [id, code, name, industryLabels, occupation, japaneseLevel, recordStatus, readinessStatus, contactabilityStatus, operationalPhase, owner, lastActivityAt, nextAction, applicationCount, hasActiveJourney, version]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        industryLabels: { type: array, minItems: 1, items: { type: string } }
        occupation: { type: string }
        japaneseLevel: { type: string }
        recordStatus: { type: string, enum: [ACTIVE, ARCHIVED] }
        readinessStatus: { type: string, enum: [NOT_READY, READY_FOR_REVIEW, READY_FOR_INTERVIEW] }
        contactabilityStatus: { type: string, enum: [CONTACTABLE, DO_NOT_CONTACT, UNKNOWN] }
        operationalPhase: { type: string, enum: [POTENTIAL, APPLYING, PASSED, SUPPLYING, SUPPLIED] }
        owner: { $ref: '#/components/schemas/PersonRef' }
        lastActivityAt: { type: string, format: date-time }
        nextAction: { type: string }
        applicationCount: { type: integer, minimum: 0 }
        hasActiveJourney: { type: boolean }
        isPossibleDuplicate: { type: boolean }
        version: { type: integer, minimum: 0 }
        emailMasked: { type: string, nullable: true }
        phoneMasked: { type: string, nullable: true }
        source: { type: string }
    CandidateDetail:
      allOf:
        - $ref: '#/components/schemas/Candidate'
        - type: object
          required: [email, phone, address, occupationProfiles, applications, journeys, emailCount, files, notes, history]
          properties:
            email: { type: string, format: email, nullable: true }
            phone: { type: string, nullable: true }
            address: { type: string, nullable: true }
            occupationProfiles: { type: array, items: { $ref: '#/components/schemas/CandidateOccupationProfile' } }
            applications: { type: array, items: { $ref: '#/components/schemas/Application' } }
            journeys: { type: array, items: { $ref: '#/components/schemas/SupplyJourneySummary' } }
            emailCount: { type: integer, minimum: 0 }
            files: { type: array, items: { $ref: '#/components/schemas/CandidateFile' } }
            notes: { type: array, items: { type: string } }
            history: { type: array, items: { $ref: '#/components/schemas/CandidateHistoryEvent' } }
    CandidatesResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Candidate' } }
        nextCursor: { type: string, nullable: true }
    CreateCandidateRequest:
      type: object
      required: [name, industryLabels, occupation, japaneseLevel, source, version]
      properties:
        name: { type: string, minLength: 1 }
        industryLabels: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        occupation: { type: string, minLength: 1 }
        japaneseLevel: { type: string, minLength: 1 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        source: { type: string, minLength: 1 }
        readinessStatus: { type: string, enum: [NOT_READY, READY_FOR_REVIEW, READY_FOR_INTERVIEW] }
        contactabilityStatus: { type: string, enum: [CONTACTABLE, DO_NOT_CONTACT, UNKNOWN] }
        version: { type: integer, minimum: 0 }
    CandidateUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/CreateCandidateRequest'
    ImportCandidatesRequest:
      type: object
      required: [fileName, rows, version]
      properties:
        fileName: { type: string, minLength: 1 }
        rows: { type: array, minItems: 1, items: { type: object, additionalProperties: true } }
        version: { type: integer, minimum: 0 }
    ImportCandidatesResponse:
      type: object
      required: [importId, fileName, totalRows, validRows, invalidRows, duplicateRows, createdCandidateIds]
      properties:
        importId: { type: string }
        fileName: { type: string }
        totalRows: { type: integer, minimum: 0 }
        validRows: { type: integer, minimum: 0 }
        invalidRows: { type: integer, minimum: 0 }
        duplicateRows: { type: integer, minimum: 0 }
        createdCandidateIds: { type: array, items: { type: string } }
    DuplicateReviewRequest:
      type: object
      required: [action, version]
      properties:
        action: { type: string, enum: [MARK_REVIEWED, KEEP_SEPARATE, MERGE] }
        targetCandidateId: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        version: { type: integer, minimum: 0 }
    AddCandidatesRequest:
      type: object
      required: [candidateIds, source]
      properties:
        candidateIds: { type: array, minItems: 1, items: { type: string } }
        source: { type: string, enum: [MANUAL_MATCH] }
    AddCandidatesResponse:
      type: object
      required: [createdApplicationIds]
      properties:
        createdApplicationIds: { type: array, items: { type: string } }
    OrderStatusUpdate:
      type: object
      required: [status, reasonCode, version]
      properties:
        status: { type: string, enum: [DRAFT, RECRUITING, PAUSED, FILLED, CLOSED] }
        reasonCode: { type: string }
        note: { type: string, maxLength: 1000 }
        version: { type: integer, minimum: 0 }
    InterviewHistoryEvent:
      type: object
      required: [id, type, occurredAt, actor, summary]
      properties:
        id: { type: string }
        type: { type: string, enum: [SCHEDULED, RESCHEDULED, CANCELLED, COMPLETED, RESULT_RECORDED] }
        occurredAt: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/PersonRef' }
        summary: { type: string }
        previousScheduledAt: { type: string, format: date-time, nullable: true }
        reason: { type: string, nullable: true }
    Interview:
      type: object
      required: [id, round, scheduledAt, timeZone, mode, scheduleStatus, result, participants, version, history, createdAt, updatedAt]
      properties:
        id: { type: string }
        round: { type: integer, minimum: 1 }
        scheduledAt: { type: string, format: date-time }
        timeZone: { type: string, minLength: 1 }
        mode: { type: string, enum: [ONLINE, IN_PERSON] }
        meetingUrl: { type: string, format: uri, nullable: true }
        location: { type: string, nullable: true }
        participants: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PersonRef' } }
        scheduleStatus: { type: string, enum: [SCHEDULED, COMPLETED, CANCELLED, NO_SHOW] }
        result: { type: string, enum: [PENDING, PASS, FAIL] }
        feedback: { type: string, nullable: true }
        strengths: { type: array, items: { type: string } }
        concerns: { type: array, items: { type: string } }
        nextStep: { type: string, nullable: true }
        version: { type: integer, minimum: 0 }
        history: { type: array, items: { $ref: '#/components/schemas/InterviewHistoryEvent' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Application:
