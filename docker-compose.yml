services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cms_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms_owner_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cms_candidate_supply}
    volumes:
      - cms-postgres:/var/lib/postgresql/data
    # Local development only; production compose keeps the database private.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - cms-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://cms_owner:cms_owner_dev@postgres:5432/cms_candidate_supply}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-cms}
      QUEUE_NAMES: ${QUEUE_NAMES:-outbox}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-development-only-encryption-key-32}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-session-secret-32}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Local authentication is email/password only. Provider OIDC is configured through staging/production compose.
      OIDC_ISSUER: ""
      OIDC_CLIENT_ID: ""
      OIDC_CLIENT_SECRET: ""
      OIDC_REDIRECT_URI: ""
      OIDC_AUDIENCE: ""
      OIDC_APPROVAL_RECORD_FILE: ""
      PRODUCTION_SEED_ACTIVATION: ${PRODUCTION_SEED_ACTIVATION:-false}
      CATALOG_APPROVAL_RECORD_FILE: ${CATALOG_APPROVAL_RECORD_FILE:-}
      DOCUMENTS_ENABLED: ${DOCUMENTS_ENABLED:-false}
      DOCUMENT_APPROVAL_RECORD_FILE: ${DOCUMENT_APPROVAL_RECORD_FILE:-}
      BULK_EXPORT_ENABLED: ${BULK_EXPORT_ENABLED:-false}
      EXPORT_APPROVAL_RECORD_FILE: ${EXPORT_APPROVAL_RECORD_FILE:-}
      PURGE_ENABLED: ${PURGE_ENABLED:-false}
      RETENTION_APPROVAL_RECORD_FILE: ${RETENTION_APPROVAL_RECORD_FILE:-}
      BREAK_GLASS_ENABLED: ${BREAK_GLASS_ENABLED:-false}
      BREAK_GLASS_APPROVAL_RECORD_FILE: ${BREAK_GLASS_APPROVAL_RECORD_FILE:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_KMS_KEY_ID: ${STORAGE_KMS_KEY_ID:-}
      STORAGE_UPLOAD_TTL_SECONDS: ${STORAGE_UPLOAD_TTL_SECONDS:-300}
      STORAGE_DOWNLOAD_TTL_SECONDS: ${STORAGE_DOWNLOAD_TTL_SECONDS:-60}
      MALWARE_SCANNER_ENDPOINT: ${MALWARE_SCANNER_ENDPOINT:-}
      MALWARE_SCANNER_TIMEOUT_MS: ${MALWARE_SCANNER_TIMEOUT_MS:-5000}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-DISABLED}
      MAIL_PROVIDER_APPROVAL_RECORD_FILE: ${MAIL_PROVIDER_APPROVAL_RECORD_FILE:-}
      MAIL_CANARY_RECIPIENTS: ${MAIL_CANARY_RECIPIENTS:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["3100:3000"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
  worker:
    profiles: ["queue"]
    extends:
      service: api
    entrypoint: ["node"]
    command: ["dist/bootstrap/worker.js"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  scheduler:
    profiles: ["queue"]
    extends:
      service: api
    entrypoint: ["node"]
    command: ["dist/bootstrap/scheduler.js"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_MSW_ENABLED: ${NEXT_PUBLIC_MSW_ENABLED:-false}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      NEXT_PUBLIC_MSW_ENABLED: ${NEXT_PUBLIC_MSW_ENABLED:-false}
    ports:
      - "3000:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
volumes:
  cms-postgres:
  cms-redis:
