services:
  api:
    image: ${API_IMAGE:?API_IMAGE must be set for production}
    build: !reset null
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:?APP_VERSION must be set for production}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN must be set for production}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set for production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for production}
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:?DATABASE_RUNTIME_ROLE must be set for production}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set for production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set for production}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set for production}
      COOKIE_SECURE: "true"
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      QUEUE_NAMES: ${QUEUE_NAMES:-outbox,reconcile,mail-ingest,mail-sync,mail-subscription,file-scan}
      PRODUCTION_SEED_ACTIVATION: ${PRODUCTION_SEED_ACTIVATION:-false}
      CATALOG_APPROVAL_RECORD_FILE: ${CATALOG_APPROVAL_RECORD_FILE:-}
      DOCUMENTS_ENABLED: ${DOCUMENTS_ENABLED:-false}
      DOCUMENT_APPROVAL_RECORD_FILE: ${DOCUMENT_APPROVAL_RECORD_FILE:-}
      BULK_EXPORT_ENABLED: ${BULK_EXPORT_ENABLED:-false}
      EXPORT_APPROVAL_RECORD_FILE: ${EXPORT_APPROVAL_RECORD_FILE:-}
      PURGE_ENABLED: ${PURGE_ENABLED:-false}
      RETENTION_APPROVAL_RECORD_FILE: ${RETENTION_APPROVAL_RECORD_FILE:-}
      BREAK_GLASS_ENABLED: ${BREAK_GLASS_ENABLED:-false}
      BREAK_GLASS_APPROVAL_RECORD_FILE: ${BREAK_GLASS_APPROVAL_RECORD_FILE:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_KMS_KEY_ID: ${STORAGE_KMS_KEY_ID:-}
      STORAGE_UPLOAD_TTL_SECONDS: ${STORAGE_UPLOAD_TTL_SECONDS:-300}
      STORAGE_DOWNLOAD_TTL_SECONDS: ${STORAGE_DOWNLOAD_TTL_SECONDS:-60}
      MALWARE_SCANNER_ENDPOINT: ${MALWARE_SCANNER_ENDPOINT:-}
      MALWARE_SCANNER_TIMEOUT_MS: ${MALWARE_SCANNER_TIMEOUT_MS:-5000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_APPROVAL_RECORD_FILE: ${OIDC_APPROVAL_RECORD_FILE:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-DISABLED}
      MAIL_PROVIDER_APPROVAL_RECORD_FILE: ${MAIL_PROVIDER_APPROVAL_RECORD_FILE:-}
    ports: !reset []
  worker:
    extends:
      file: docker-compose.yml
      service: worker
    image: ${API_IMAGE:?API_IMAGE must be set for production}
    build: !reset null
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:?APP_VERSION must be set for production}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN must be set for production}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set for production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for production}
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:?DATABASE_RUNTIME_ROLE must be set for production}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set for production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set for production}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set for production}
      COOKIE_SECURE: "true"
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      QUEUE_NAMES: ${QUEUE_NAMES:-outbox,reconcile,mail-ingest,mail-sync,mail-subscription,file-scan}
      PRODUCTION_SEED_ACTIVATION: ${PRODUCTION_SEED_ACTIVATION:-false}
      CATALOG_APPROVAL_RECORD_FILE: ${CATALOG_APPROVAL_RECORD_FILE:-}
      DOCUMENTS_ENABLED: ${DOCUMENTS_ENABLED:-false}
      DOCUMENT_APPROVAL_RECORD_FILE: ${DOCUMENT_APPROVAL_RECORD_FILE:-}
      BULK_EXPORT_ENABLED: ${BULK_EXPORT_ENABLED:-false}
      EXPORT_APPROVAL_RECORD_FILE: ${EXPORT_APPROVAL_RECORD_FILE:-}
      PURGE_ENABLED: ${PURGE_ENABLED:-false}
      RETENTION_APPROVAL_RECORD_FILE: ${RETENTION_APPROVAL_RECORD_FILE:-}
      BREAK_GLASS_ENABLED: ${BREAK_GLASS_ENABLED:-false}
      BREAK_GLASS_APPROVAL_RECORD_FILE: ${BREAK_GLASS_APPROVAL_RECORD_FILE:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_KMS_KEY_ID: ${STORAGE_KMS_KEY_ID:-}
      STORAGE_UPLOAD_TTL_SECONDS: ${STORAGE_UPLOAD_TTL_SECONDS:-300}
      STORAGE_DOWNLOAD_TTL_SECONDS: ${STORAGE_DOWNLOAD_TTL_SECONDS:-60}
      MALWARE_SCANNER_ENDPOINT: ${MALWARE_SCANNER_ENDPOINT:-}
      MALWARE_SCANNER_TIMEOUT_MS: ${MALWARE_SCANNER_TIMEOUT_MS:-5000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_APPROVAL_RECORD_FILE: ${OIDC_APPROVAL_RECORD_FILE:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-DISABLED}
      MAIL_PROVIDER_APPROVAL_RECORD_FILE: ${MAIL_PROVIDER_APPROVAL_RECORD_FILE:-}
    ports: !reset []
  scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    image: ${API_IMAGE:?API_IMAGE must be set for production}
    build: !reset null
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:?APP_VERSION must be set for production}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN must be set for production}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set for production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for production}
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:?DATABASE_RUNTIME_ROLE must be set for production}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set for production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set for production}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set for production}
      COOKIE_SECURE: "true"
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      QUEUE_NAMES: ${QUEUE_NAMES:-outbox,reconcile,mail-ingest,mail-sync,mail-subscription,file-scan}
      PRODUCTION_SEED_ACTIVATION: ${PRODUCTION_SEED_ACTIVATION:-false}
      CATALOG_APPROVAL_RECORD_FILE: ${CATALOG_APPROVAL_RECORD_FILE:-}
      DOCUMENTS_ENABLED: ${DOCUMENTS_ENABLED:-false}
      DOCUMENT_APPROVAL_RECORD_FILE: ${DOCUMENT_APPROVAL_RECORD_FILE:-}
      BULK_EXPORT_ENABLED: ${BULK_EXPORT_ENABLED:-false}
      EXPORT_APPROVAL_RECORD_FILE: ${EXPORT_APPROVAL_RECORD_FILE:-}
      PURGE_ENABLED: ${PURGE_ENABLED:-false}
      RETENTION_APPROVAL_RECORD_FILE: ${RETENTION_APPROVAL_RECORD_FILE:-}
      BREAK_GLASS_ENABLED: ${BREAK_GLASS_ENABLED:-false}
      BREAK_GLASS_APPROVAL_RECORD_FILE: ${BREAK_GLASS_APPROVAL_RECORD_FILE:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_KMS_KEY_ID: ${STORAGE_KMS_KEY_ID:-}
      STORAGE_UPLOAD_TTL_SECONDS: ${STORAGE_UPLOAD_TTL_SECONDS:-300}
      STORAGE_DOWNLOAD_TTL_SECONDS: ${STORAGE_DOWNLOAD_TTL_SECONDS:-60}
      MALWARE_SCANNER_ENDPOINT: ${MALWARE_SCANNER_ENDPOINT:-}
      MALWARE_SCANNER_TIMEOUT_MS: ${MALWARE_SCANNER_TIMEOUT_MS:-5000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_APPROVAL_RECORD_FILE: ${OIDC_APPROVAL_RECORD_FILE:-}
    ports: !reset []
  migrate:
    image: ${MIGRATION_IMAGE:?MIGRATION_IMAGE must be set for production}
    build: !reset null
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for production}
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:?DATABASE_RUNTIME_ROLE must be set for production}
    working_dir: /app/apps/api
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    profiles: ["migration"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be set for production}
    ports: !reset []
  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be set for production}
    ports: !reset []
  web:
    extends:
      file: docker-compose.yml
      service: web
    image: ${WEB_IMAGE:?WEB_IMAGE must be set for production}
    build: !reset null
    ports: !reset []
